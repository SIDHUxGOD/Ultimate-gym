sheet(`<h2>${T}</h2><p class="mu" style="margin:0 0 18px">${mode==='set'?'Choose a 4-digit PIN. You will need it every time you open the app.':mode==='remove'?'Enter your PIN to turn off the lock.':'Enter your current PIN, then choose a new one.'}</p>${mode!=='set'?inp('p-c','Current PIN'):''}${mode!=='remove'?inp('p-n','New PIN (4 digits)')+inp('p-r','Confirm new PIN'):''}<p id="err" class="err"></p><button class="btn p w" id="p-ok">${T}</button>`);
$('#p-ok').onclick=async e=>{const g=s=>$(s)?$(s).value.replace(/\D/g,''):'';if(mode!=='set'&&await hp(g('#p-c'))!==P.h)return err('Current PIN is wrong.');
if(mode==='remove'){localStorage.removeItem(LS);closeSheet();toast('PIN removed');return}
const n=g('#p-n');if(n.length!==4)return err('PIN must be 4 digits.');if(n!==g('#p-r'))return err('The two PINs do not match.');e.target.disabled=true;let rc=null,r=P&&P.r;
if(mode==='set'){rc=String(100000+crypto.getRandomValues(new Uint32Array(1))[0]%900000);r=await hp('rc'+rc)}
localStorage.setItem(LS,JSON.stringify({h:await hp(n),r}));
if(rc){sheet(`<h2>Save your recovery code</h2><p class="mu" style="margin:0">If you forget your PIN, this code is the only way to reset it without losing data. Write it down and keep it safe.</p><div class="panel" style="padding:22px;text-align:center;font-size:34px;letter-spacing:.2em;font-weight:600;margin:18px 0">${rc}</div><button class="btn p w" id="dn">I have saved it</button>`);$('#dn').onclick=closeSheet}else{closeSheet();toast('PIN changed')}}}
norm();head();if(getP())lockNow();go('home');
(async()=>{try{const c=window.claude&&await window.claude.use('db');if(!c)return;db=c;const sn=await db.doc('gym/data').get();
if(sn.exists){const d=sn.data();if((d.ts||0)>S.ts){S=JSON.parse(JSON.stringify(d));norm();head();refresh()}else if(S.ts>(d.ts||0))persist()}else if(S.members.length)persist()}catch(e){}})();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
